<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <title>Vista &mdash; Travel Journal</title>
    <style>
        :root {
            --accent: #588157;
            --accent-dim: rgba(88, 129, 87, 0.3);
            --accent-glow: rgba(88, 129, 87, 0.15);
            --secondary: #A3B18A;
            --primary: #344E41;
            --bg: #0c0f0c;
            --bg-card: #151a15;
            --bg-card-hover: #1c231c;
            --bg-nav: rgba(12, 15, 12, 0.88);
            --text: #e4e8e0;
            --text-dim: rgba(228, 232, 224, 0.55);
            --text-mid: rgba(228, 232, 224, 0.75);
            --border: rgba(255, 255, 255, 0.06);
            --line: rgba(88, 129, 87, 0.25);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg: #f4f2ed;
            --bg-card: #ffffff;
            --bg-card-hover: #fafaf7;
            --bg-nav: rgba(244, 242, 237, 0.92);
            --text: #2a2f2a;
            --text-dim: rgba(42, 47, 42, 0.45);
            --text-mid: rgba(42, 47, 42, 0.7);
            --border: rgba(0, 0, 0, 0.07);
            --line: rgba(88, 129, 87, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Sora', 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 0;
            z-index: 1000;
            background-color: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background-color 0.3s ease;
        }

        .navbar .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--secondary);
        }

        .navbar .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-mid);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a.active {
            color: var(--text);
            font-weight: 600;
        }

        .nav-links a.active::after {
            width: 100%;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-mid);
            cursor: pointer;
            padding: 0.45rem 0.55rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            line-height: 1;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .theme-toggle .icon-sun {
            display: inline;
        }

        .theme-toggle .icon-moon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-sun {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-moon {
            display: inline;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            z-index: 200;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text);
            transition: all 0.3s ease;
            border-radius: 1px;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 140;
        }

        .nav-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem 4rem;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 30% 60%, var(--accent-glow) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 30%, rgba(163, 177, 138, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-label {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .hero h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 4.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 520px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 3rem;
        }

        .scroll-cue {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            position: absolute;
            bottom: 2.5rem;
        }

        .scroll-cue span {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes scrollPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scaleY(0.6);
            }

            50% {
                opacity: 1;
                transform: scaleY(1);
            }
        }

        .timeline-section {
            padding: 4rem 0 6rem;
            position: relative;
        }

        .timeline-section .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--line) 5%, var(--line) 95%, transparent);
            transform: translateX(-50%);
        }

        .tl-entry {
            display: flex;
            align-items: flex-start;
            margin-bottom: 5rem;
            position: relative;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .tl-entry.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .tl-entry:last-child {
            margin-bottom: 0;
        }

        .tl-entry.left .tl-content {
            width: 45%;
            text-align: right;
            padding-right: 3rem;
        }

        .tl-entry.left .tl-photos {
            width: 45%;
            margin-left: auto;
            padding-left: 3rem;
        }

        .tl-entry.right {
            flex-direction: row-reverse;
        }

        .tl-entry.right .tl-content {
            width: 45%;
            text-align: left;
            padding-left: 3rem;
        }

        .tl-entry.right .tl-photos {
            width: 45%;
            margin-right: auto;
            padding-right: 3rem;
        }

        .tl-dot {
            position: absolute;
            left: 50%;
            top: 0.5rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--accent);
            border: 3px solid var(--bg);
            transform: translateX(-50%);
            z-index: 2;
            box-shadow: 0 0 0 4px var(--accent-dim);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .tl-location {
            font-family: 'DM Serif Display', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 0.3rem;
        }

        .tl-date {
            font-size: 0.78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .tl-caption {
            font-size: 0.92rem;
            color: var(--text-dim);
            line-height: 1.65;
            font-weight: 300;
        }

        .tl-photos {
            display: grid;
            gap: 8px;
        }

        .tl-photos.single {
            grid-template-columns: 1fr;
        }

        .tl-photos.duo {
            grid-template-columns: 1fr 1fr;
        }

        .tl-photos.trio {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
        }

        .tl-photos.trio .tl-photo:first-child {
            grid-column: 1 / -1;
        }

        .tl-photos.quad {
            grid-template-columns: 1fr 1fr;
        }

        .tl-photo {
            overflow: hidden;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
        }

        .tl-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
            aspect-ratio: 4 / 3;
        }

        .tl-photos.single .tl-photo img {
            aspect-ratio: 16 / 10;
        }

        .tl-photo:hover img {
            transform: scale(1.04);
        }

        .tl-photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 6px;
            pointer-events: none;
        }

        .tl-photo:hover::after {
            opacity: 1;
        }

        .journey-end {
            text-align: center;
            padding: 3rem 0 5rem;
        }

        .journey-end .end-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 0 4px var(--accent-dim);
        }

        .journey-end p {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--text-dim);
            font-style: italic;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lb-close {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .lb-close:hover {
            color: #fff;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 3rem;
            cursor: pointer;
            padding: 1rem;
            transition: color 0.2s;
            user-select: none;
            line-height: 1;
        }

        .lb-nav:hover {
            color: #fff;
        }

        .lb-prev {
            left: 1rem;
        }

        .lb-next {
            right: 1rem;
        }

        .lb-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        @media (max-width: 900px) {
            .timeline-line {
                left: 24px;
            }

            .tl-entry,
            .tl-entry.right {
                flex-direction: column;
            }

            .tl-entry.left .tl-content,
            .tl-entry.right .tl-content {
                width: 100%;
                text-align: left;
                padding: 0 0 1rem 3.5rem;
            }

            .tl-entry.left .tl-photos,
            .tl-entry.right .tl-photos {
                width: 100%;
                margin: 0;
                padding: 0 0 0 3.5rem;
            }

            .tl-dot {
                left: 24px;
                top: 0.3rem;
            }

            .hero h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 280px;
                height: 100vh;
                background-color: var(--bg);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2rem;
                transition: right 0.3s ease;
                box-shadow: -5px 0 30px rgba(0, 0, 0, 0.4);
                z-index: 150;
            }

            .nav-links.open {
                right: 0;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2.4rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .tl-location {
                font-size: 1.3rem;
            }

            .tl-photos.duo,
            .tl-photos.trio,
            .tl-photos.quad {
                grid-template-columns: 1fr;
            }

            .tl-photos.trio .tl-photo:first-child {
                grid-column: auto;
            }

            .timeline-line {
                left: 16px;
            }

            .tl-dot {
                left: 16px;
            }

            .tl-entry.left .tl-content,
            .tl-entry.right .tl-content,
            .tl-entry.left .tl-photos,
            .tl-entry.right .tl-photos {
                padding-left: 2.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="nav-overlay" id="navOverlay"></div>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Ro<span>hit</span></div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="index.html#about">About</a>
                <a href="index.html#portfolio">Portfolio</a>
                <a href="vista.html" class="active">Vista</a>
                <a href="index.html#contact">Contact</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="icon-moon">&#9789;</span>
                    <span class="icon-sun">&#9788;</span>
                </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <span class="hero-label">Travel Journal</span>
        <h1>Carpe Diem</h1>
        <p>A trail of footprints through places that left a mark. Each stop is a chapter &mdash; scroll through the
            journey.</p>
        <div class="scroll-cue">
            <span>Begin</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <section class="timeline-section">
        <div class="container">
            <div class="timeline-line"></div>
            <div id="timelineContainer"></div>
            <div class="journey-end">
                <div class="end-dot"></div>
                <p>The journey continues&hellip;</p>
            </div>
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <div class="lb-close" id="lbClose">&times;</div>
        <div class="lb-nav lb-prev" id="lbPrev">&#8249;</div>
        <img src="" alt="" id="lbImage">
        <div class="lb-nav lb-next" id="lbNext">&#8250;</div>
        <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script>
        const trips = [
            {
                location: "First Light", date: "",
                caption: "Where it all started. The first frames that made me want to keep shooting.",
                layout: "trio",
                photos: [
                    { src: "images/vista/IMG_3257.JPG", alt: "Silhouette" },
                    { src: "images/vista/IMG_3258.JPG", alt: "Momentum" },
                    { src: "images/vista/IMG_3259.JPG", alt: "Symmetry" },
                ]
            },
            {
                location: "Quiet Roads", date: "",
                caption: "Solitude on the open road \u2014 the kind of silence that resets everything.",
                layout: "duo",
                photos: [
                    { src: "images/vista/IMG_3262.JPG", alt: "Solitude" },
                    { src: "images/vista/IMG_3263.JPG", alt: "Contrast" },
                ]
            },
            {
                location: "Shifting Perspectives", date: "",
                caption: "The same world looks different when you change where you stand.",
                layout: "trio",
                photos: [
                    { src: "images/vista/IMG_3302.JPG", alt: "Perspective" },
                    { src: "images/vista/IMG_3303.JPG", alt: "Reflection" },
                    { src: "images/vista/IMG_3304.JPG", alt: "Texture" },
                ]
            },
            {
                location: "Into the Mist", date: "",
                caption: "Mornings wrapped in fog, where the landscape reveals itself slowly.",
                layout: "duo",
                photos: [
                    { src: "images/vista/IMG_3325.JPG", alt: "Depth" },
                    { src: "images/vista/IMG_3330.JPG", alt: "Atmosphere" },
                ]
            },
            {
                location: "Golden Hours", date: "",
                caption: "That brief window when the light does all the heavy lifting.",
                layout: "trio",
                photos: [
                    { src: "IMG_3363.JPG", alt: "Atmosphere" },
                    { src: "IMG_3374.JPG", alt: "Atmosphere" },
                    { src: "IMG_3415.JPG", alt: "Fragment" },
                ]
            },
            {
                location: "High Ground", date: "",
                caption: "Climbing for the view \u2014 and the feeling that comes with it.",
                layout: "duo",
                photos: [
                    { src: "IMG_3820.JPG", alt: "Atmosphere" },
                    { src: "IMG_3821.JPG", alt: "Atmosphere" },
                ]
            },
            {
                location: "Rhythms", date: "",
                caption: "Patterns in nature, patterns in movement. You start seeing them everywhere.",
                layout: "duo",
                photos: [
                    { src: "IMG_3954.JPG", alt: "Atmosphere" },
                    { src: "IMG_3976.JPG", alt: "Rhythm" },
                ]
            },
            {
                location: "New Terrain", date: "",
                caption: "Unfamiliar ground. That uneasy excitement of not knowing what\u2019s around the next bend.",
                layout: "quad",
                photos: [
                    { src: "IMG_4107.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4108.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4117.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4209.JPEG", alt: "Atmosphere" },
                ]
            },
            {
                location: "Wide Open", date: "",
                caption: "Space to breathe. The kind of emptiness that feels full.",
                layout: "quad",
                photos: [
                    { src: "IMG_4228.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4241.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4267.JPEG", alt: "Atmosphere" },
                    { src: "IMG_4679.JPEG", alt: "Atmosphere" },
                ]
            },
            {
                location: "Fading Light", date: "",
                caption: "The last frames of the day. When everything turns soft and unhurried.",
                layout: "single",
                photos: [
                    { src: "IMG_4639.JPEG", alt: "Atmosphere" },
                ]
            },
            {
                location: "Kodachadri", date: "",
                caption: "The wind and you. Standing above the clouds at the edge of the Western Ghats.",
                layout: "single",
                photos: [
                    { src: "kodachadri.jpg", alt: "The wind and you" },
                ]
            },
        ];

        const allPhotos = [];

        function buildTimeline() {
            const container = document.getElementById('timelineContainer');
            trips.forEach((trip, i) => {
                const side = i % 2 === 0 ? 'left' : 'right';
                const entry = document.createElement('div');
                entry.className = `tl-entry ${side}`;
                const photoStart = allPhotos.length;
                trip.photos.forEach(p => allPhotos.push(p));
                const photosHTML = trip.photos.map((p, j) =>
                    `<div class="tl-photo" data-index="${photoStart + j}">
                    <img src="${p.src}" alt="${p.alt}" loading="lazy">
                </div>`
                ).join('');
                const dateHTML = trip.date ? `<div class="tl-date">${trip.date}</div>` : '';
                entry.innerHTML = `
                <div class="tl-dot"></div>
                <div class="tl-content">
                    <div class="tl-location">${trip.location}</div>
                    ${dateHTML}
                    <div class="tl-caption">${trip.caption}</div>
                </div>
                <div class="tl-photos ${trip.layout}">${photosHTML}</div>
            `;
                container.appendChild(entry);
            });
            document.querySelectorAll('.tl-photo').forEach(el => {
                el.addEventListener('click', () => openLightbox(parseInt(el.dataset.index)));
            });
            const entries = document.querySelectorAll('.tl-entry');
            const obs = new IntersectionObserver((items) => {
                items.forEach(item => {
                    if (item.isIntersecting) { item.target.classList.add('visible'); obs.unobserve(item.target); }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });
            entries.forEach(el => obs.observe(el));
        }

        let currentLB = 0;
        const lightbox = document.getElementById('lightbox');
        const lbImage = document.getElementById('lbImage');
        const lbCounter = document.getElementById('lbCounter');

        function openLightbox(i) {
            currentLB = i; updateLB();
            lightbox.classList.add('active'); document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lightbox.classList.remove('active'); document.body.style.overflow = '';
        }
        function navLB(dir) {
            currentLB = (currentLB + dir + allPhotos.length) % allPhotos.length; updateLB();
        }
        function updateLB() {
            lbImage.src = allPhotos[currentLB].src;
            lbImage.alt = allPhotos[currentLB].alt;
            lbCounter.textContent = `${currentLB + 1} / ${allPhotos.length}`;
        }

        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lbPrev').addEventListener('click', () => navLB(-1));
        document.getElementById('lbNext').addEventListener('click', () => navLB(1));
        lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navLB(-1);
            if (e.key === 'ArrowRight') navLB(1);
        });

        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        function getTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        function setTheme(t) { root.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
        setTheme(getTheme());
        themeToggle.addEventListener('click', () => {
            setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        const navOverlay = document.getElementById('navOverlay');
        function toggleMenu() {
            hamburger.classList.toggle('open'); navLinks.classList.toggle('open');
            navOverlay.classList.toggle('open');
            document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
        }
        hamburger.addEventListener('click', toggleMenu);
        navOverlay.addEventListener('click', toggleMenu);
        navLinks.querySelectorAll('a').forEach(l =>
            l.addEventListener('click', () => { if (navLinks.classList.contains('open')) toggleMenu(); })
        );

        window.addEventListener('DOMContentLoaded', buildTimeline);
    </script>
</body>

</html>
