<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <title>Vista &mdash; Photo Gallery</title>
    <style>
        /* ============================================
           THEME VARIABLES (shared with main site)
           ============================================ */
        :root {
            --accent-color: #588157;
            --secondary-color: #A3B18A;
            --primary-color: #344E41;

            --bg-primary: #0a0a0a;
            --bg-nav: rgba(0, 0, 0, 0.8);
            --text-primary: #f8f8f8;
            --text-secondary: rgba(248, 248, 248, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        /* Vista is dark by default, but we flip for light mode */
        [data-theme="light"] {
            --bg-primary: #f5f5f0;
            --bg-nav: rgba(245, 245, 240, 0.92);
            --text-primary: #2d2d2d;
            --text-secondary: rgba(45, 45, 45, 0.65);
            --border-color: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Sora', 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 0;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ============================================
           NAVBAR (matching main site)
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 0;
            z-index: 1000;
            background-color: var(--bg-nav);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }

        .navbar .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--secondary-color);
        }

        .navbar .logo span {
            color: var(--accent-color);
        }

        [data-theme="light"] .navbar .logo {
            color: var(--secondary-color);
        }

        [data-theme="light"] .navbar .logo span {
            color: var(--primary-color);
        }

        .navbar .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .navbar .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar .nav-links a:hover {
            color: var(--text-primary);
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        .navbar .nav-links a.active {
            color: var(--text-primary);
            font-weight: 600;
        }

        .navbar .nav-links a.active::after {
            width: 100%;
            background-color: var(--accent-color);
        }

        /* Theme toggle */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.45rem 0.55rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            line-height: 1;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            display: none;
        }

        /* Vista defaults to dark, so show sun to switch to light */
        .theme-toggle .icon-sun {
            display: inline;
        }

        [data-theme="light"] .theme-toggle .icon-sun {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-moon {
            display: inline;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            z-index: 200;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--text-primary);
            transition: all 0.3s ease;
            border-radius: 1px;
        }

        .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .nav-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
            z-index: 140;
        }
        .nav-overlay.open { opacity: 1; visibility: visible; }

        /* ============================================
           INTRO
           ============================================ */
        .intro {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            padding-top: 80px;
        }

        .intro h1 {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        .intro p {
            font-size: 1.15rem;
            font-weight: 300;
            max-width: 600px;
            text-align: center;
            margin-bottom: 3rem;
            color: var(--text-secondary);
        }

        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* ============================================
           MASONRY GRID
           ============================================ */
        .masonry-container {
            padding: 0 2rem 4rem;
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 10px;
            grid-gap: 16px;
        }

        .masonry-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        .masonry-item.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .masonry-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: contrast(1.05) brightness(0.92);
        }

        [data-theme="light"] .masonry-item img {
            filter: contrast(1.02) brightness(1);
        }

        .masonry-item:hover img {
            transform: scale(1.03);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
        }

        [data-theme="light"] .overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
        }

        .masonry-item:hover .overlay {
            opacity: 1;
        }

        .overlay h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #fff;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .overlay p {
            font-weight: 300;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.8);
            transform: translateY(20px);
            transition: transform 0.4s ease 0.05s;
        }

        .masonry-item:hover .overlay h3,
        .masonry-item:hover .overlay p {
            transform: translateY(0);
        }

        /* ============================================
           VIEW TOGGLE
           ============================================ */
        .view-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.7rem 1.2rem;
            font-size: 0.78rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            font-family: inherit;
        }

        .view-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] .view-toggle {
            background-color: rgba(52, 78, 65, 0.85);
            border-color: transparent;
        }

        [data-theme="light"] .view-toggle:hover {
            background-color: rgba(52, 78, 65, 1);
        }

        /* ============================================
           FULLSCREEN VIEW
           ============================================ */
        .fullscreen-view {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-view.active {
            display: flex;
        }

        .fullscreen-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 4px;
        }

        .close-fullscreen {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .close-fullscreen:hover {
            transform: scale(1.2);
        }

        /* Navigation arrows in fullscreen */
        .fs-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 2.5rem;
            cursor: pointer;
            padding: 1rem;
            transition: color 0.2s ease;
            user-select: none;
        }

        .fs-nav:hover {
            color: #fff;
        }

        .fs-prev { left: 1rem; }
        .fs-next { right: 1rem; }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .intro h1 {
                font-size: 3rem;
            }

            .masonry-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .hamburger { display: flex; }

            .navbar .nav-links {
                position: fixed;
                top: 0; right: -100%;
                width: 280px; height: 100vh;
                background-color: var(--bg-primary);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2rem;
                transition: right 0.3s ease;
                box-shadow: -5px 0 30px rgba(0,0,0,0.3);
                z-index: 150;
            }

            .navbar .nav-links.open {
                right: 0;
            }
        }

        @media (max-width: 480px) {
            .intro h1 {
                font-size: 2.2rem;
            }

            .masonry-grid {
                grid-template-columns: 1fr;
            }

            .navbar .container {
                width: 95%;
            }
        }
    </style>
</head>
<body>

<!-- Nav overlay for mobile -->
<div class="nav-overlay" id="navOverlay"></div>

<nav class="navbar">
    <div class="container">
        <div class="logo">
            Ro<span>hit</span>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="index.html#about">About</a>
            <a href="index.html#portfolio">Portfolio</a>
            <a href="vista.html" class="active">Vista</a>
            <a href="index.html#contact">Contact</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span class="icon-moon">&#9789;</span>
                <span class="icon-sun">&#9788;</span>
            </button>
        </div>
    </div>
</nav>

<section class="intro">
    <h1>CARPE DIEM</h1>
    <p>A collection of moments captured through the lens of perspective, light, and emotion.</p>
    <div class="scroll-hint">Scroll to explore</div>
</section>

<button class="view-toggle" onclick="toggleView()">Toggle View</button>

<section class="masonry-container">
    <div class="masonry-grid" id="masonryGrid"></div>
</section>

<div class="fullscreen-view" id="fullscreenView">
    <div class="close-fullscreen" onclick="closeFullscreen()">&times;</div>
    <div class="fs-nav fs-prev" onclick="navigateFullscreen(-1)">&#8249;</div>
    <img src="" alt="" class="fullscreen-image" id="fullscreenImage">
    <div class="fs-nav fs-next" onclick="navigateFullscreen(1)">&#8250;</div>
</div>

<script>
    // ========== THEME (syncs with main site via localStorage) ==========
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function getPreferredTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) return saved;
        // Vista defaults to dark, but respect OS pref if explicitly light
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }

    function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }

    setTheme(getPreferredTheme());

    themeToggle.addEventListener('click', () => {
        const current = root.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ========== HAMBURGER ==========
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    const navOverlay = document.getElementById('navOverlay');

    function toggleMenu() {
        hamburger.classList.toggle('open');
        navLinks.classList.toggle('open');
        navOverlay.classList.toggle('open');
        document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
    }

    hamburger.addEventListener('click', toggleMenu);
    navOverlay.addEventListener('click', toggleMenu);
    navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', () => {
        if (navLinks.classList.contains('open')) toggleMenu();
    }));

    // ========== PHOTOS ==========
    const photos = [
        { src: "IMG_3257.JPG", title: "Silhouette", description: "Light defines shape in abstract form" },
        { src: "IMG_3258.JPG", title: "Momentum", description: "Capturing the essence of motion" },
        { src: "IMG_3259.JPG", title: "Symmetry", description: "Finding balance in visual elements" },
        { src: "IMG_3262.JPG", title: "Solitude", description: "The power of isolation and space" },
        { src: "IMG_3263.JPG", title: "Contrast", description: "The interplay of light and shadow" },
        { src: "IMG_3302.JPG", title: "Perspective", description: "Altering perception through viewpoint" },
        { src: "IMG_3303.JPG", title: "Reflection", description: "The world mirrored back upon itself" },
        { src: "IMG_3304.JPG", title: "Texture", description: "The tactile quality of visual space" },
        { src: "IMG_3325.JPG", title: "Depth", description: "Exploring layers of visual field" },
        { src: "IMG_3976.JPG", title: "Rhythm", description: "Patterns creating visual harmony" },
        { src: "IMG_3415.JPG", title: "Fragment", description: "The power of the incomplete" },
        { src: "IMG_3363.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3374.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3330.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3820.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3821.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3954.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4107.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4108.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4117.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4209.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4228.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4241.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4267.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4679.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_4639.JPEG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "IMG_3954.JPG", title: "Atmosphere", description: "Mood captured through environmental elements" },
        { src: "kodachadri.jpg", title: "The wind and you", description: "You are not alone here" }
    ];

    let currentIndex = 0;

    function initMasonry() {
        const grid = document.getElementById('masonryGrid');

        photos.forEach((photo, index) => {
            const item = document.createElement('div');
            item.className = 'masonry-item';

            const height = Math.floor(Math.random() * (500 - 200) + 200);
            const rowSpan = Math.ceil(height / 10);
            item.style.gridRowEnd = `span ${rowSpan}`;

            item.innerHTML = `
                <img src="${photo.src}" alt="${photo.title}" loading="lazy">
                <div class="overlay">
                    <h3>${photo.title}</h3>
                    <p>${photo.description}</p>
                </div>
            `;

            grid.appendChild(item);

            item.addEventListener('click', () => openFullscreen(index));

            // Staggered reveal via IntersectionObserver
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            observer.observe(item);
        });
    }

    function toggleView() {
        const grid = document.getElementById('masonryGrid');
        if (grid.style.gridTemplateColumns === "1fr") {
            grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(300px, 1fr))";
        } else {
            grid.style.gridTemplateColumns = "1fr";
        }
    }

    function openFullscreen(index) {
        currentIndex = index;
        const fsView = document.getElementById('fullscreenView');
        const fsImage = document.getElementById('fullscreenImage');
        fsImage.src = photos[index].src;
        fsImage.alt = photos[index].title;
        fsView.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeFullscreen() {
        document.getElementById('fullscreenView').classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    function navigateFullscreen(direction) {
        currentIndex = (currentIndex + direction + photos.length) % photos.length;
        const fsImage = document.getElementById('fullscreenImage');
        fsImage.src = photos[currentIndex].src;
        fsImage.alt = photos[currentIndex].title;
    }

    window.addEventListener('DOMContentLoaded', initMasonry);

    document.getElementById('fullscreenView').addEventListener('click', function(e) {
        if (e.target === this) closeFullscreen();
    });

    document.addEventListener('keydown', function(e) {
        const fs = document.getElementById('fullscreenView');
        if (!fs.classList.contains('active')) return;
        if (e.key === 'Escape') closeFullscreen();
        if (e.key === 'ArrowLeft') navigateFullscreen(-1);
        if (e.key === 'ArrowRight') navigateFullscreen(1);
    });
</script>
</body>
</html>
